name: Test
on:
  push:
  pull_request:
  schedule: [{ cron: "0 0 10 * *" }] # monthly https://crontab.guru/#0_0_10_*_*
  workflow_dispatch:

permissions: {}
jobs:
  test:
    uses: nodenv/.github/.github/workflows/test.yml@01e040ae4850b8e589e1300d71f8af1690000d6a # v7.0.9
    with: { npm: false, superlinter: false }
    permissions:
      contents: read
      packages: read
      id-token: write
      security-events: write
      statuses: write
